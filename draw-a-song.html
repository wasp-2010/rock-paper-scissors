<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw a Song</title>
<meta name="description" content="Draw on a chalkboard and watch your doodle become a little melody.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#EDE7DA;
    --wood:#6b4a33;
    --wood-dark:#4a3121;
    --board:#213229;
    --board-edge:#182620;
    --chalk:#F4F1E8;
    --chalk-dim:#B9C2B7;
    --blue:#8FC1DE;
    --yellow:#F2D06B;
    --pink:#EC93A9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    min-height:100vh;
    background:var(--wall);
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    overscroll-behavior:none;
  }

  .frame{
    width:100%;
    max-width:960px;
    height:min(88vh,720px);
    padding:16px;
    border-radius:12px;
    background:linear-gradient(155deg,var(--wood) 0%,var(--wood-dark) 100%);
    box-shadow:0 18px 40px rgba(40,28,18,.25), inset 0 0 0 1px rgba(0,0,0,.15);
  }

  .board{
    position:relative;
    width:100%;
    height:100%;
    border-radius:5px;
    background:radial-gradient(120% 140% at 50% 0%, #2a3b31 0%, var(--board) 55%, var(--board-edge) 100%);
    overflow:hidden;
    box-shadow:inset 0 0 40px rgba(0,0,0,.45);
  }

  .back{
    position:absolute;
    top:14px;
    left:16px;
    z-index:4;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:19px;
    color:var(--chalk-dim);
    text-decoration:none;
    opacity:.85;
  }
  .back:hover{opacity:1;color:var(--chalk);}
  .back:focus-visible{outline:2px dashed var(--chalk); outline-offset:3px;}

  .title{
    position:absolute;
    top:8px;
    right:22px;
    z-index:4;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:clamp(26px,4.4vw,36px);
    color:var(--chalk);
    transform:rotate(-2deg);
    text-shadow:0 0 10px rgba(244,241,232,.15);
    pointer-events:none;
  }

  .canvas-wrap{
    position:absolute;
    inset:56px 0 74px 0;
    background-image:
      linear-gradient(rgba(244,241,232,.14), rgba(244,241,232,.14)),
      linear-gradient(rgba(244,241,232,.14), rgba(244,241,232,.14)),
      linear-gradient(rgba(244,241,232,.14), rgba(244,241,232,.14)),
      linear-gradient(rgba(244,241,232,.14), rgba(244,241,232,.14)),
      linear-gradient(rgba(244,241,232,.14), rgba(244,241,232,.14));
    background-size:100% 1px;
    background-position:0 16.6%, 0 33.3%, 0 50%, 0 66.6%, 0 83.3%;
    background-repeat:no-repeat;
  }
  canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }

  .hint{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    font-family:'Caveat',cursive;
    font-weight:600;
    font-size:clamp(18px,2.6vw,24px);
    color:var(--chalk-dim);
    text-align:center;
    max-width:72%;
    line-height:1.5;
    pointer-events:none;
    transition:opacity .4s ease;
  }
  .hint.hidden{opacity:0;}

  .note-label{
    position:absolute;
    z-index:5;
    font-family:'Caveat',cursive;
    font-weight:700;
    font-size:20px;
    color:var(--chalk);
    pointer-events:none;
    opacity:0;
    transform:translate(14px,-26px);
    transition:opacity .12s ease;
    text-shadow:0 0 6px rgba(0,0,0,.4);
  }
  .note-label.show{opacity:.9;}

  .playhead{
    position:absolute;
    width:16px;
    height:16px;
    margin-left:-8px;
    margin-top:-8px;
    border-radius:50%;
    background:radial-gradient(circle, #fff 0%, rgba(255,255,255,.15) 70%, transparent 100%);
    box-shadow:0 0 14px 4px rgba(244,241,232,.6);
    z-index:6;
    display:none;
    pointer-events:none;
  }

  .toolbar{
    position:absolute;
    left:0; right:0; bottom:14px;
    z-index:4;
    display:flex;
    justify-content:space-between;
    padding:0 20px;
  }
  .chalk-btn{
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:.01em;
    color:var(--chalk);
    background:transparent;
    border:2px dashed rgba(244,241,232,.55);
    border-radius:9px;
    padding:9px 18px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .chalk-btn:hover:not(:disabled){background:rgba(244,241,232,.08); border-color:var(--chalk);}
  .chalk-btn:active:not(:disabled){background:rgba(244,241,232,.16);}
  .chalk-btn:disabled{opacity:.35; cursor:not-allowed;}
  .chalk-btn:focus-visible{outline:2px solid var(--chalk); outline-offset:3px;}
  .chalk-btn.primary{border-style:solid; border-color:var(--yellow); color:var(--yellow);}
  .chalk-btn.primary:hover:not(:disabled){background:rgba(242,208,107,.12);}

  .dust{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    pointer-events:none;
    z-index:5;
    animation:dustPuff .6s ease-out forwards;
  }
  @keyframes dustPuff{
    0%{transform:translate(0,0) scale(1); opacity:.9;}
    100%{transform:translate(var(--dx,0px), var(--dy,14px)) scale(.2); opacity:0;}
  }

  @media (max-width:560px){
    .frame{height:92vh; padding:10px;}
    .title{font-size:24px; top:6px; right:14px;}
    .back{font-size:16px; top:10px; left:12px;}
    .canvas-wrap{inset:46px 0 68px 0;}
    .chalk-btn{font-size:13px; padding:8px 14px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>

<div class="frame">
  <div class="board">
    <a class="back" href="index.html">&larr; mini games</a>
    <div class="title">Draw a Song</div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="hint" id="hint">Draw on the board without lifting —<br>watch your doodle turn into a tune.</div>
      <div class="note-label" id="noteLabel"></div>
      <div class="playhead" id="playhead"></div>
    </div>

    <div class="toolbar">
      <button class="chalk-btn" id="clearBtn" type="button">✂ erase board</button>
      <button class="chalk-btn primary" id="playBtn" type="button" disabled>▷ play my song</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // low → high, two-octave pentatonic, grouped into three chalk colors
  var SCALE = [
    {name:"C4", freq:261.63, color:"#8FC1DE"},
    {name:"D4", freq:293.66, color:"#8FC1DE"},
    {name:"E4", freq:329.63, color:"#8FC1DE"},
    {name:"G4", freq:392.00, color:"#8FC1DE"},
    {name:"A4", freq:440.00, color:"#F2D06B"},
    {name:"C5", freq:523.25, color:"#F2D06B"},
    {name:"D5", freq:587.33, color:"#F2D06B"},
    {name:"E5", freq:659.25, color:"#EC93A9"},
    {name:"G5", freq:783.99, color:"#EC93A9"},
    {name:"A5", freq:880.00, color:"#EC93A9"},
    {name:"C6", freq:1046.50,color:"#EC93A9"}
  ];

  var canvas = document.getElementById("canvas");
  var ctx2d = canvas.getContext("2d");
  var wrap = document.querySelector(".canvas-wrap");
  var hint = document.getElementById("hint");
  var noteLabel = document.getElementById("noteLabel");
  var playhead = document.getElementById("playhead");
  var clearBtn = document.getElementById("clearBtn");
  var playBtn = document.getElementById("playBtn");

  var strokes = [];       // array of strokes; each stroke = array of {x,y,t} fractions
  var currentStroke = null;
  var lastPoint = null;
  var drawing = false;
  var playing = false;
  var dpr = Math.max(1, window.devicePixelRatio || 1);

  function resizeCanvas(){
    var rect = wrap.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    redrawAll();
  }

  function noteIndexForY(yFrac){
    var i = Math.round((1 - yFrac) * (SCALE.length - 1));
    return Math.min(SCALE.length - 1, Math.max(0, i));
  }

  function toPixels(p){
    var rect = wrap.getBoundingClientRect();
    return {x: p.x * rect.width, y: p.y * rect.height};
  }

  function drawSegment(a, b){
    var pa = toPixels(a), pb = toPixels(b);
    var color = SCALE[noteIndexForY(b.y)].color;
    ctx2d.lineCap = "round";
    ctx2d.lineJoin = "round";
    // two slightly offset passes for a rough chalk-like texture
    for(var i=0;i<2;i++){
      var jx = (Math.random()-0.5) * 1.1;
      var jy = (Math.random()-0.5) * 1.1;
      ctx2d.strokeStyle = color;
      ctx2d.globalAlpha = i === 0 ? 0.85 : 0.35;
      ctx2d.lineWidth = i === 0 ? 4 : 6;
      ctx2d.beginPath();
      ctx2d.moveTo(pa.x + jx, pa.y + jy);
      ctx2d.lineTo(pb.x + jx, pb.y + jy);
      ctx2d.stroke();
    }
    ctx2d.globalAlpha = 1;
  }

  function redrawAll(){
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(function(stroke){
      for(var i=1;i<stroke.length;i++){
        drawSegment(stroke[i-1], stroke[i]);
      }
    });
  }

  function spawnDust(xFrac, yFrac, color){
    var rect = wrap.getBoundingClientRect();
    var cx = xFrac * rect.width, cy = yFrac * rect.height;
    for(var i=0;i<5;i++){
      var d = document.createElement("div");
      d.className = "dust";
      d.style.left = cx + "px";
      d.style.top = cy + "px";
      d.style.background = color;
      var dx = (Math.random()-0.5) * 30;
      var dy = 10 + Math.random() * 20;
      d.style.setProperty("--dx", dx + "px");
      d.style.setProperty("--dy", dy + "px");
      wrap.appendChild(d);
      (function(el){
        el.addEventListener("animationend", function(){ el.remove(); });
        setTimeout(function(){ if(el.parentNode){ el.remove(); } }, 900);
      })(d);
    }
  }

  // ---------- audio ----------
  var audioCtx = null;
  function getAudio(){
    try{
      if(!audioCtx){
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if(!Ctx){ return null; }
        audioCtx = new Ctx();
      }
      if(audioCtx.state === "suspended"){ audioCtx.resume(); }
      return audioCtx;
    }catch(e){ return null; }
  }

  var liveOsc = null, liveGain = null, livePanner = null;
  function startLiveTone(xFrac, yFrac){
    var ctx = getAudio(); if(!ctx){ return; }
    liveOsc = ctx.createOscillator();
    liveOsc.type = "sine";
    liveOsc.frequency.value = SCALE[noteIndexForY(yFrac)].freq;
    liveGain = ctx.createGain();
    liveGain.gain.setValueAtTime(0, ctx.currentTime);
    liveGain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.06);
    liveOsc.connect(liveGain);
    if(ctx.createStereoPanner){
      livePanner = ctx.createStereoPanner();
      livePanner.pan.value = xFrac * 2 - 1;
      liveGain.connect(livePanner);
      livePanner.connect(ctx.destination);
    } else {
      livePanner = null;
      liveGain.connect(ctx.destination);
    }
    liveOsc.start();
  }
  function updateLiveTone(xFrac, yFrac){
    if(!liveOsc){ return; }
    var ctx = getAudio(); if(!ctx){ return; }
    var note = SCALE[noteIndexForY(yFrac)];
    liveOsc.frequency.setTargetAtTime(note.freq, ctx.currentTime, 0.045);
    if(livePanner){ livePanner.pan.setTargetAtTime(xFrac * 2 - 1, ctx.currentTime, 0.08); }
    showNoteLabel(note.name, xFrac, yFrac);
  }
  function stopLiveTone(){
    if(!liveOsc){ return; }
    var ctx = getAudio();
    if(ctx){
      var g = liveGain;
      var now = ctx.currentTime;
      g.gain.cancelScheduledValues(now);
      g.gain.setValueAtTime(g.gain.value, now);
      g.gain.linearRampToValueAtTime(0, now + 0.09);
    }
    var osc = liveOsc;
    setTimeout(function(){ try{ osc.stop(); }catch(e){} }, 140);
    liveOsc = null; liveGain = null; livePanner = null;
    hideNoteLabel();
  }

  function showNoteLabel(name, xFrac, yFrac){
    var rect = wrap.getBoundingClientRect();
    noteLabel.textContent = name;
    noteLabel.style.left = (xFrac * rect.width) + "px";
    noteLabel.style.top = (yFrac * rect.height) + "px";
    noteLabel.classList.add("show");
  }
  function hideNoteLabel(){ noteLabel.classList.remove("show"); }

  function scheduleNote(ctx, when, dur, freq, xFrac){
    var osc = ctx.createOscillator();
    osc.type = "sine";
    osc.frequency.value = freq;
    var gain = ctx.createGain();
    var peak = 0.26;
    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(peak, when + 0.015);
    gain.gain.setValueAtTime(peak, Math.max(when + 0.015, when + dur - 0.05));
    gain.gain.linearRampToValueAtTime(0, when + dur);
    osc.connect(gain);
    if(ctx.createStereoPanner){
      var panner = ctx.createStereoPanner();
      panner.pan.value = xFrac * 2 - 1;
      gain.connect(panner);
      panner.connect(ctx.destination);
    } else {
      gain.connect(ctx.destination);
    }
    osc.start(when);
    osc.stop(when + dur + 0.05);
  }

  // ---------- pointer handling ----------
  function getFrac(e){
    var rect = wrap.getBoundingClientRect();
    var x = (e.clientX - rect.left) / rect.width;
    var y = (e.clientY - rect.top) / rect.height;
    return {x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y))};
  }

  canvas.addEventListener("pointerdown", function(e){
    if(playing){ return; }
    canvas.setPointerCapture(e.pointerId);
    drawing = true;
    hint.classList.add("hidden");
    var p = getFrac(e);
    currentStroke = [{x:p.x, y:p.y, t: performance.now()}];
    lastPoint = p;
    startLiveTone(p.x, p.y);
    var col = SCALE[noteIndexForY(p.y)].color;
    spawnDust(p.x, p.y, col);
  });

  canvas.addEventListener("pointermove", function(e){
    if(!drawing){ return; }
    var p = getFrac(e);
    currentStroke.push({x:p.x, y:p.y, t: performance.now()});
    drawSegment(lastPoint, p);
    updateLiveTone(p.x, p.y);
    lastPoint = p;
  });

  function endStroke(){
    if(!drawing){ return; }
    drawing = false;
    stopLiveTone();
    if(currentStroke && currentStroke.length >= 1){
      strokes.push(currentStroke);
      playBtn.disabled = false;
    }
    currentStroke = null;
  }
  canvas.addEventListener("pointerup", endStroke);
  canvas.addEventListener("pointercancel", endStroke);
  canvas.addEventListener("pointerleave", function(){ if(drawing){ endStroke(); } });

  // ---------- clear ----------
  clearBtn.addEventListener("click", function(){
    if(playing){ return; }
    strokes = [];
    redrawAll();
    playBtn.disabled = true;
    hint.classList.remove("hidden");
  });

  // ---------- playback ----------
  function strokeToNotes(stroke){
    if(stroke.length === 0){ return []; }
    var bucketMs = 90, maxNoteMs = 480, minNoteMs = 70;
    var startT = stroke[0].t;
    var buckets = [];
    var cur = null;
    stroke.forEach(function(p){
      var idx = Math.floor((p.t - startT) / bucketMs);
      if(!cur || cur.idx !== idx){
        cur = {idx:idx, xs:[], ys:[]};
        buckets.push(cur);
      }
      cur.xs.push(p.x);
      cur.ys.push(p.y);
    });
    var raw = buckets.map(function(b){
      var x = b.xs.reduce(function(a,v){return a+v;},0) / b.xs.length;
      var y = b.ys.reduce(function(a,v){return a+v;},0) / b.ys.length;
      return {noteIndex: noteIndexForY(y), x:x, y:y};
    });
    // merge consecutive equal notes into longer notes
    var notes = [];
    raw.forEach(function(r){
      var last = notes[notes.length-1];
      if(last && last.noteIndex === r.noteIndex && last.duration < maxNoteMs){
        last.duration += bucketMs;
      } else {
        notes.push({noteIndex:r.noteIndex, x:r.x, y:r.y, duration:bucketMs});
      }
    });
    notes.forEach(function(n){ n.duration = Math.max(minNoteMs, n.duration); });
    return notes;
  }

  function positionPlayhead(xFrac, yFrac){
    var rect = wrap.getBoundingClientRect();
    playhead.style.left = (xFrac * rect.width) + "px";
    playhead.style.top = (yFrac * rect.height) + "px";
  }

  function playDoodle(){
    if(playing || strokes.length === 0){ return; }
    var ctx = getAudio(); if(!ctx){ return; }
    playing = true;
    playBtn.disabled = true;
    clearBtn.disabled = true;
    hint.classList.add("hidden");

    var events = [];
    var cursor = 0;
    strokes.forEach(function(stroke){
      var notes = strokeToNotes(stroke);
      notes.forEach(function(n){
        events.push({start:cursor, duration:n.duration, note:SCALE[n.noteIndex], x:n.x, y:n.y});
        cursor += n.duration;
      });
      cursor += 140;
    });
    if(events.length === 0){
      playing = false; playBtn.disabled = false; clearBtn.disabled = false;
      return;
    }

    var startCtxTime = ctx.currentTime + 0.06;
    events.forEach(function(ev){
      scheduleNote(ctx, startCtxTime + ev.start/1000, ev.duration/1000, ev.note.freq, ev.x);
    });

    var totalMs = cursor;
    var startWall = performance.now();
    playhead.style.display = "block";
    positionPlayhead(events[0].x, events[0].y);

    var lastDustIdx = -1;

    function frame(){
      var elapsed = performance.now() - startWall;
      if(elapsed >= totalMs){
        playhead.style.display = "none";
        playing = false;
        playBtn.disabled = false;
        clearBtn.disabled = false;
        hint.classList.remove("hidden");
        return;
      }
      var idx = 0;
      for(var i=0;i<events.length;i++){
        if(events[i].start <= elapsed){ idx = i; } else { break; }
      }
      if(idx !== lastDustIdx){
        lastDustIdx = idx;
        spawnDust(events[idx].x, events[idx].y, events[idx].note.color);
        showNoteLabel(events[idx].note.name, events[idx].x, events[idx].y);
      }
      var curEv = events[idx];
      var nextEv = events[idx+1];
      var segStart = curEv.start, segEnd = nextEv ? nextEv.start : (curEv.start + curEv.duration);
      var frac = segEnd > segStart ? Math.min(1, (elapsed - segStart) / (segEnd - segStart)) : 1;
      var tx = curEv.x + ((nextEv ? nextEv.x : curEv.x) - curEv.x) * frac;
      var ty = curEv.y + ((nextEv ? nextEv.y : curEv.y) - curEv.y) * frac;
      positionPlayhead(tx, ty);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  playBtn.addEventListener("click", function(){
    getAudio();
    playDoodle();
  });

  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
})();
</script>
</body>
</html>
