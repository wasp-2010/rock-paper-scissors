<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Games</title>
<meta name="description" content="A small collection of browser mini-games.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@700&family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1620;
    --ink-soft:#6b6675;
    --line:#E7E3ED;
    --card:#FAF9FC;
    --accent:#E2603F;
    --accent-dark:#9E3A22;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:#FFFFFF;
    color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 60px;
  }

  header{
    text-align:center;
    margin-bottom:40px;
    max-width:520px;
  }
  header .eyebrow{
    font-family:'Silkscreen',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--accent-dark);
    text-transform:uppercase;
  }
  header h1{
    font-size:clamp(28px,5vw,38px);
    margin:10px 0 0;
    letter-spacing:-.01em;
  }

  .grid{
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
    align-items:stretch;
  }

  .card{
    display:flex;
    flex-direction:column;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    text-decoration:none;
    color:var(--ink);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 14px 28px rgba(27,22,32,.08);
  }
  .card:focus-visible{
    outline:3px solid var(--accent);
    outline-offset:3px;
  }

  .card-image{
    width:100%;
    aspect-ratio:400/220;
    display:block;
    background:#2b1a3d;
  }
  .card-image svg{
    width:100%;
    height:100%;
    display:block;
  }

  .card-body{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:20px 22px 22px;
    flex:1;
  }
  .card-body h2{
    font-size:17px;
    margin:0;
  }
  .card-body p{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0;
    flex:1;
  }
  .card-body .play{
    align-self:flex-start;
    margin-top:6px;
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--accent-dark);
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .card-body .play .arrow{transition:transform .15s ease;}
  .card:hover .play .arrow{transform:translateX(3px);}
</style>
</head>
<body>

<header>
  <div class="eyebrow">Browser Arcade</div>
  <h1>Mini Games</h1>
</header>

<main class="grid">

  <a class="card" href="rock-paper-scissors.html">
    <div class="card-image">
      <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Rock, paper and scissors illustration">
        <defs>
          <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2b1a3d"/>
            <stop offset="55%" stop-color="#6a2f4b"/>
            <stop offset="100%" stop-color="#e2603f"/>
          </linearGradient>
          <radialGradient id="rockGrad" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#c9c6cf"/>
            <stop offset="60%" stop-color="#9a97a3"/>
            <stop offset="100%" stop-color="#726f7c"/>
          </radialGradient>
          <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#e9e6ee"/>
          </linearGradient>
          <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f2f1f5"/>
            <stop offset="100%" stop-color="#a8a5b1"/>
          </linearGradient>
        </defs>

        <rect width="400" height="220" fill="url(#bgGrad)"/>
        <circle cx="370" cy="20" r="90" fill="#ffffff" opacity="0.05"/>
        <circle cx="10" cy="210" r="70" fill="#ffffff" opacity="0.06"/>

        <!-- badge shadows -->
        <ellipse cx="90" cy="176" rx="46" ry="10" fill="#140a1d" opacity="0.28"/>
        <ellipse cx="200" cy="176" rx="46" ry="10" fill="#140a1d" opacity="0.28"/>
        <ellipse cx="310" cy="176" rx="46" ry="10" fill="#140a1d" opacity="0.28"/>

        <!-- rock badge -->
        <circle cx="90" cy="112" r="58" fill="#ffffff" opacity="0.97"/>
        <g transform="translate(90,112)">
          <path d="M -30,8 C -33,-10 -17,-24 0,-25 C 17,-26 32,-13 33,3 C 34,18 20,27 1,27 C -14,27 -28,22 -30,8 Z" fill="url(#rockGrad)" stroke="#5f5c68" stroke-width="1.5"/>
          <path d="M -16,-6 C -10,-12 0,-13 6,-8" stroke="#5f5c68" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
          <ellipse cx="-12" cy="-9" rx="8" ry="4" fill="#ffffff" opacity="0.45" transform="rotate(-18 -12 -9)"/>
        </g>

        <!-- paper badge -->
        <circle cx="200" cy="112" r="58" fill="#ffffff" opacity="0.97"/>
        <g transform="translate(200,112) rotate(-8)">
          <rect x="-24" y="-30" width="48" height="60" rx="5" fill="url(#paperGrad)" stroke="#c7c3cf" stroke-width="1.5"/>
          <path d="M 12,-30 L 24,-30 L 24,-18 Z" fill="#d8d4e0"/>
          <rect x="-14" y="-8" width="28" height="3.5" rx="1.75" fill="#cfc9db"/>
          <rect x="-14" y="2" width="28" height="3.5" rx="1.75" fill="#cfc9db"/>
          <rect x="-14" y="12" width="20" height="3.5" rx="1.75" fill="#cfc9db"/>
        </g>

        <!-- scissors badge -->
        <circle cx="310" cy="112" r="58" fill="#ffffff" opacity="0.97"/>
        <g transform="translate(310,120)">
          <path d="M0,0 L 32,-44 C 38,-48 44,-44 42,-36 L 13,4 Z" fill="url(#bladeGrad)" stroke="#8a8794" stroke-width="1.5"/>
          <path d="M0,0 L -32,-44 C -38,-48 -44,-44 -42,-36 L -13,4 Z" fill="url(#bladeGrad)" stroke="#8a8794" stroke-width="1.5"/>
          <circle cx="-15" cy="24" r="13" fill="none" stroke="#e2603f" stroke-width="7"/>
          <circle cx="15" cy="24" r="13" fill="none" stroke="#e2603f" stroke-width="7"/>
          <circle cx="0" cy="0" r="4.5" fill="#4a4753"/>
        </g>
      </svg>
    </div>
    <div class="card-body">
      <h2>Rock Paper Scissors</h2>
      <p>Classic, sudden death or endless — plus secret weapons, difficulty settings and achievements.</p>
      <span class="play">Play now <span class="arrow">→</span></span>
    </div>
  </a>

  <a class="card" href="draw-a-song.html">
    <div class="card-image">
      <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chalkboard with a colorful doodle turning into musical notes">
        <defs>
          <radialGradient id="boardGrad" cx="50%" cy="0%" r="120%">
            <stop offset="0%" stop-color="#2a3b31"/>
            <stop offset="60%" stop-color="#213229"/>
            <stop offset="100%" stop-color="#182620"/>
          </radialGradient>
        </defs>
        <rect width="400" height="220" fill="url(#boardGrad)"/>
        <rect x="8" y="8" width="384" height="204" rx="4" fill="none" stroke="#3a4c41" stroke-width="2"/>
        <g stroke="#F4F1E8" stroke-opacity="0.12">
          <line x1="24" y1="45" x2="376" y2="45"/>
          <line x1="24" y1="80" x2="376" y2="80"/>
          <line x1="24" y1="115" x2="376" y2="115"/>
          <line x1="24" y1="150" x2="376" y2="150"/>
          <line x1="24" y1="185" x2="376" y2="185"/>
        </g>
        <path d="M 40,170 C 80,60 120,190 170,90 C 210,20 250,130 300,60 C 330,20 350,70 368,40"
              fill="none" stroke="#8FC1DE" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
        <path d="M 40,170 C 80,60 120,190 170,90"
              fill="none" stroke="#8FC1DE" stroke-width="5" stroke-linecap="round"/>
        <path d="M 170,90 C 210,20 250,130 300,60"
              fill="none" stroke="#F2D06B" stroke-width="5" stroke-linecap="round"/>
        <path d="M 300,60 C 330,20 350,70 368,40"
              fill="none" stroke="#EC93A9" stroke-width="5" stroke-linecap="round"/>
        <circle cx="368" cy="40" r="7" fill="#EC93A9"/>
        <g fill="#F4F1E8" opacity="0.85" font-family="Georgia, serif">
          <text x="90" y="40" font-size="20">&#9834;</text>
          <text x="230" y="45" font-size="16">&#9835;</text>
          <text x="330" y="30" font-size="18">&#9834;</text>
        </g>
      </svg>
    </div>
    <div class="card-body">
      <h2>Draw a Song</h2>
      <p>Sketch on a chalkboard without lifting your finger, and watch (and hear) your doodle turn into a little melody.</p>
      <span class="play">Play now <span class="arrow">→</span></span>
    </div>
  </a>

  <!--
    TEMPLATE — copy this block to add a new game to the grid.
    1. Duplicate the <a class="card">...</a> block above.
    2. Point href at the new game's HTML file (e.g. "tic-tac-toe.html"),
       upload that file alongside this one.
    3. Replace the <svg> inside .card-image with your own artwork
       (or swap it for an <img src="your-image.jpg" alt="..."> if you'd
       rather use a photo/illustration file instead of inline SVG).
    4. Update the h2 title and p description in .card-body.

    <a class="card" href="new-game.html">
      <div class="card-image">
        <svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg">...</svg>
      </div>
      <div class="card-body">
        <h2>New Game</h2>
        <p>One or two lines describing what it is.</p>
        <span class="play">Play now <span class="arrow">→</span></span>
      </div>
    </a>
  -->


</main>

</body>
</html>
